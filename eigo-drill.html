<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>高1 英語 反復ドリル｜Curry Travels 対応</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --card3:#334155;
    --text:#f1f5f9; --sub:#94a3b8;
    --accent:#38bdf8; --accent2:#0ea5e9;
    --correct:#22c55e; --correct-bg:#14331f;
    --wrong:#ef4444; --wrong-bg:#3a1616;
    --amber:#f59e0b;
    --border:#334155; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#0f172a 0%,#111c33 100%);
    color:var(--text); min-height:100vh; line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .app{max-width:540px;margin:0 auto;padding:16px 16px 48px;min-height:100vh;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.02em;}
  .top h1 .em{color:var(--accent);}
  .badge{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .progress-wrap{height:8px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:6px;}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s;}
  .progress-text{font-size:12px;color:var(--sub);text-align:right;margin-bottom:8px;}
  /* 進捗ドット（○×一覧） */
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
  .dot{width:24px;height:24px;border-radius:7px;background:var(--card2);border:1px solid var(--border);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:700;cursor:pointer;padding:0;transition:transform .07s;}
  .dot:active{transform:scale(.9);}
  .dot.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .dot.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .dot.current{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 2px rgba(56,189,248,.25);}
  .dots-legend{font-size:11px;color:var(--sub);margin:-4px 0 12px;display:flex;gap:12px;flex-wrap:wrap;}
  .dots-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
  .lg-c::before{background:var(--correct);} .lg-w::before{background:var(--wrong);} .lg-n::before{background:var(--card3);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .screen{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .hidden{display:none !important;}

  /* スタート */
  .hero{text-align:center;padding:6px 4px 2px;}
  .hero .big{font-size:23px;font-weight:800;margin:6px 0 4px;}
  .hero .lead{color:var(--sub);font-size:13.5px;}
  .icon-badge{width:60px;height:60px;line-height:60px;font-size:30px;margin:0 auto 6px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(56,189,248,.35);}
  .group-label{font-size:13px;color:var(--sub);font-weight:800;margin:22px 4px 10px;display:flex;align-items:center;gap:6px;}
  .deck{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:transform .08s,border-color .15s;text-align:left;width:100%;color:var(--text);}
  .deck:active{transform:scale(.98);}
  .deck .d-emoji{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
  .deck .d-main{flex:1;min-width:0;display:block;}
  .deck .d-title{font-size:15px;font-weight:700;display:block;}
  .deck .d-sub{font-size:11.5px;color:var(--sub);display:block;}
  .deck .d-right{display:block;}
  .deck .d-bar{height:6px;background:var(--card3);border-radius:999px;overflow:hidden;margin-top:7px;}
  .deck .d-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s;}
  .deck.done .d-bar-fill{background:linear-gradient(90deg,var(--correct),#16a34a);}
  .deck .d-right{font-size:11px;color:var(--sub);text-align:right;flex-shrink:0;}
  .deck .d-count{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:3px;white-space:nowrap;}
  .deck .d-mark{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:var(--card3);color:var(--sub);font-weight:700;}
  .deck.done .d-mark{background:var(--correct-bg);color:#86efac;}
  .deck.partial{border-color:var(--amber);}
  .deck.partial .d-mark{background:rgba(245,158,11,.15);color:#fcd34d;}

  .resume-box{margin:16px 0 4px;background:var(--wrong-bg);border:1px solid #7f2b2b;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .resume-box .rt{font-size:13px;}
  .resume-box .rt b{color:#fca5a5;}
  .btn-small{background:var(--wrong);color:#fff;border:none;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn-small:active{transform:scale(.96);}
  .link-clear{display:block;text-align:center;color:var(--sub);font-size:12px;margin-top:16px;text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;}
  .foot-note{font-size:11px;color:var(--sub);text-align:center;margin-top:22px;line-height:1.7;}

  /* クイズ共通 */
  .q-mode{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .q-mode.retry{color:#fca5a5;}
  .q-type-tag{font-size:10px;background:var(--card3);color:var(--sub);padding:2px 8px;border-radius:6px;margin-left:auto;font-weight:700;}
  .q-jp{font-size:15px;font-weight:700;margin:2px 0 4px;line-height:1.5;}
  .q-en{font-size:16px;color:#dbe4ee;margin-bottom:14px;line-height:1.6;}
  .q-en .blank{color:var(--amber);font-weight:800;}

  /* 並べ替え */
  .order-hint{font-size:12.5px;color:var(--amber);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:5px;}
  .sentence-line{display:flex;flex-wrap:wrap;align-items:center;gap:7px;background:#0b1626;border:1px solid var(--border);border-radius:12px;padding:14px 13px;margin-bottom:12px;line-height:2;}
  .fixed-txt{color:#e8eef5;font-size:15.5px;font-weight:500;}
  .slot-brk{color:var(--amber);font-size:27px;font-weight:800;line-height:1;}
  .answer-zone{display:inline-flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:40px;min-width:78px;padding:5px 8px;border-radius:9px;background:rgba(245,158,11,.10);border:1.5px dashed var(--amber);}
  .answer-zone.empty{justify-content:center;}
  .answer-zone.empty::before{content:"ここに単語を入れる";color:var(--amber);font-size:11.5px;opacity:.85;white-space:nowrap;}
  .chip{background:var(--card3);border:1px solid #475569;border-radius:10px;padding:9px 13px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .07s;user-select:none;}
  .chip:active{transform:scale(.94);}
  .chip.in-answer{background:var(--accent);color:#04263a;border-color:var(--accent);}
  .source-zone{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 4px;min-height:20px;}
  .clear-link{font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer;background:none;border:none;padding:2px;}

  /* 4択 */
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{background:var(--card2);border:2px solid var(--border);border-radius:13px;padding:14px;font-size:16px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;transition:transform .07s,border-color .15s;display:flex;align-items:center;gap:11px;min-height:52px;line-height:1.4;}
  .choice:active{transform:scale(.98);}
  .choice .mk{width:24px;height:24px;min-width:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);font-weight:800;}
  .choice.correct{border-color:var(--correct);background:var(--correct-bg);}
  .choice.correct .mk{background:var(--correct);border-color:var(--correct);color:#fff;}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .choice.wrong .mk{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .choice.disabled{pointer-events:none;}
  .choice.dim{opacity:.45;}

  /* 入力系 */
  .fill-in{width:100%;background:#0b1626;border:2px solid var(--border);border-radius:11px;padding:13px 14px;font-size:17px;color:var(--text);font-weight:600;outline:none;}
  .fill-in:focus{border-color:var(--accent);}
  .fill-in.ok{border-color:var(--correct);background:var(--correct-bg);}
  .fill-in.ng{border-color:var(--wrong);background:var(--wrong-bg);}
  .cloze-text{font-size:15.5px;line-height:2.4;color:#dbe4ee;}
  .cloze-in{display:inline-block;width:120px;background:#0b1626;border:2px solid var(--border);border-radius:8px;padding:5px 8px;font-size:15px;color:var(--text);font-weight:700;outline:none;text-align:center;margin:0 2px;vertical-align:middle;}
  .cloze-in:focus{border-color:var(--accent);}
  .cloze-in.ok{border-color:var(--correct);background:var(--correct-bg);}
  .cloze-in.ng{border-color:var(--wrong);background:var(--wrong-bg);}

  /* 動詞3変化 */
  .verb-base{text-align:center;margin:6px 0 16px;}
  .verb-base .vb-word{font-size:34px;font-weight:800;color:var(--accent);}
  .verb-base .vb-mean{font-size:13px;color:var(--sub);}
  .verb-base .vb-pat{font-size:11px;background:var(--card3);color:var(--sub);padding:2px 9px;border-radius:6px;font-weight:700;display:inline-block;margin-top:5px;}
  .vrow{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .vrow .vlab{width:92px;font-size:13px;color:var(--sub);font-weight:700;flex-shrink:0;}
  .vrow .fill-in{flex:1;}
  .vrow .vans{font-size:13px;font-weight:700;flex-shrink:0;min-width:70px;}
  .vans.ok{color:#86efac;} .vans.ng{color:#fca5a5;}

  /* 解説 */
  .explain{margin-top:16px;border-radius:13px;padding:15px;animation:fade .2s;}
  .explain.ok{background:var(--correct-bg);border:1px solid #2f6b43;}
  .explain.ng{background:var(--wrong-bg);border:1px solid #7f2b2b;}
  .explain .head{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .explain.ok .head{color:#86efac;} .explain.ng .head{color:#fca5a5;}
  .explain .ans{font-size:14px;margin-bottom:8px;}
  .explain .ans b{color:#fff;}
  .explain .body{font-size:13.5px;color:#dbe4ee;line-height:1.75;}
  .explain .body .kw{color:var(--accent);font-weight:700;}
  .explain .miss{font-size:12.5px;color:#fca5a5;margin-top:8px;background:rgba(0,0,0,.2);padding:8px 10px;border-radius:8px;}

  .action-btn{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:800;border:none;border-radius:13px;cursor:pointer;}
  .btn-check{background:linear-gradient(135deg,var(--amber),#d97706);color:#3a2405;}
  .btn-next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04263a;box-shadow:0 6px 16px rgba(56,189,248,.3);}
  .action-btn:active{transform:scale(.98);}

  /* 結果 */
  .result{text-align:center;}
  .ring{width:132px;height:132px;margin:8px auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) var(--deg,0deg),var(--card2) 0deg);}
  .ring .inner{width:106px;height:106px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .pct{font-size:28px;font-weight:800;} .ring .lab{font-size:11px;color:var(--sub);}
  .result .msg{font-size:15px;margin:10px 4px 4px;font-weight:700;}
  .stat-row{display:flex;gap:10px;margin:18px 0 6px;}
  .stat{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 6px;}
  .stat .n{font-size:22px;font-weight:800;} .stat .l{font-size:11px;color:var(--sub);}
  .stat.g .n{color:var(--correct);} .stat.r .n{color:var(--wrong);}
  .btn-primary{width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:800;border:none;border-radius:13px;background:var(--wrong);color:#fff;cursor:pointer;}
  .btn-primary.disabled{background:var(--card2);color:var(--sub);pointer-events:none;}
  .btn-ghost{width:100%;margin-top:10px;padding:14px;font-size:15px;font-weight:700;border:1px solid var(--border);border-radius:13px;background:transparent;color:var(--text);cursor:pointer;}
  .btn-primary:active,.btn-ghost:active{transform:scale(.98);}
</style>
</head>
<body>
<div class="app">

  <!-- ===== スタート ===== -->
  <div id="screen-start" class="screen">
    <div class="top">
      <h1>高1 <span class="em">英語</span> 反復ドリル</h1>
      <span class="badge" id="total-badge"></span>
    </div>
    <div class="card hero">
      <div class="icon-badge">🍛</div>
      <div class="big">解いて・間違えて・くり返す</div>
      <div class="lead">並べ替え・4択・穴埋め・スペル特訓。<br>間違えた問題は自動で苦手ストックへ。</div>
    </div>
    <div id="resume-slot"></div>
    <div id="deck-list"></div>
    <button class="link-clear" id="clear-btn">学習記録（苦手ストック・クリア済み）をリセット</button>
    <div class="foot-note">スタディサプリ確認テスト＋『Curry Travels around the World』Lesson 2 対応<br>間違えた問題はブラウザに保存され、リロードしても消えません。</div>
  </div>

  <!-- ===== クイズ ===== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="top">
      <span class="badge" id="quiz-deck">deck</span>
      <span class="badge" id="quiz-score">0 / 0</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="progress-text" id="ptext"></div>
    <div class="dots" id="dots"></div>
    <div class="dots-legend"><span class="lg-c">正解</span><span class="lg-w">まちがい</span><span class="lg-n">未回答</span><span style="opacity:.7">※タップで移動</span></div>
    <div class="card">
      <div class="q-mode" id="q-mode"><span id="q-mode-label">出題中</span><span class="q-type-tag" id="q-type-tag"></span></div>
      <div id="q-body"></div>
      <div id="explain-slot"></div>
      <button class="action-btn" id="main-btn"></button>
    </div>
    <button class="link-clear" id="quit-btn">やめてトップに戻る</button>
  </div>

  <!-- ===== 結果 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="top"><h1>おつかれさま！</h1><span class="badge" id="result-deck"></span></div>
    <div class="card result">
      <div class="ring" id="ring"><div class="inner"><div class="pct" id="result-pct">0%</div><div class="lab">正解率</div></div></div>
      <div class="msg" id="result-msg"></div>
      <div class="stat-row">
        <div class="stat g"><div class="n" id="stat-correct">0</div><div class="l">正解</div></div>
        <div class="stat r"><div class="n" id="stat-wrong">0</div><div class="l">まちがい</div></div>
        <div class="stat"><div class="n" id="stat-total">0</div><div class="l">問題数</div></div>
      </div>
      <button class="btn-primary" id="retry-wrong-btn"></button>
      <button class="btn-ghost" id="again-btn">同じセットをもう一度（反復）</button>
      <button class="btn-ghost" id="home-btn">トップに戻る</button>
    </div>
    <div id="stock-note" class="foot-note"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   データ：文字起こし素材（スタサプ確認テスト／Curry Travels／基礎トレ）
   ===================================================================== */

// 並べ替え問題ヘルパ用に、各問は type ごとにフィールドを持つ
// order : {type:"order", jp, prefix?, suffix?, tokens:[], answer:"", explain, miss?}
// mc    : {type:"mc", jp?, en?, choices:[], answer:idx, explain}
// fill  : {type:"fill", jp?, en, answer, accept?:[], explain}  (en内の ___ が空所)
// cloze : {type:"cloze", jp?, text(＋{}), answers:[], explain}
// verb  : {type:"verb", base, mean, pat, past, pp, ing}
// conj  : {type:"conj", jp, en, answer, accept?:[], explain} (単一空所タイピング)

const DECKS = [
  /* ---------- スタディサプリ：文型 ---------- */
  {id:"sup_bunkei", group:"スタディサプリ 確認テスト", title:"① 文型と文の要素", emoji:"🧩", sub:"並べ替え・10問", q:[
    {type:"order", jp:"私は犬が好きではない。", tokens:["like","don't","dogs","I"], answer:"I don't like dogs",
     explain:'<span class="kw">S(I) + V(don\'t like) + O(dogs)</span> の第3文型。「〜を」にあたる目的語 dogs を動詞の後ろに置く。'},
    {type:"order", jp:"アメリカ人の友人は、納豆が大好きです。", tokens:["friend","loves","American","my"], suffix:"natto.", answer:"My American friend loves",
     explain:'主語の塊は <span class="kw">My American friend</span>。3人称単数なので動詞は loves。'},
    {type:"order", jp:"楽しそうですね。", tokens:["look","you","happy"], answer:"You look happy",
     explain:'<span class="kw">SVC（第2文型）</span>。You = happy の関係。look は「〜に見える」で補語 happy をとる。'},
    {type:"order", jp:"友だちを作るのは簡単ではない。", tokens:["making","is","friends","easy","not"], answer:"Making friends is not easy",
     explain:'<span class="kw">Making friends（友達を作ること）で1つの主語の塊</span>。friends が複数形でも主語全体は単数扱いなので動詞は is。',
     miss:'よくある誤り → 「Friends is making not easy」。動名詞の塊を崩さないこと。'},
    {type:"order", jp:"彼はいい車をもっている。", tokens:["car","a","he","nice","has"], answer:"He has a nice car",
     explain:'SVO。目的語は <span class="kw">a nice car</span>（冠詞→形容詞→名詞の順）。'},
    {type:"order", jp:"父はキッチンをペンキで塗った。", tokens:["the","painted","father","kitchen","my"], answer:"My father painted the kitchen",
     explain:'S(My father) V(painted) O(the kitchen) の第3文型。'},
    {type:"order", jp:"彼女はこの本を、私にくれました。", tokens:["me","this","gave","book","she"], answer:"She gave me this book",
     explain:'<span class="kw">SVOO（第4文型）</span>。gave + O1(me:人) + O2(this book:物)＝「人に物を与える」の語順。'},
    {type:"order", jp:"私は理科の宿題に3時間もかかった。", tokens:["3 hours","took","me","the science homework"], answer:"The science homework took me 3 hours",
     explain:'<span class="kw">物が主語</span>になり took me 3 hours（私に3時間かからせた）という語順。',
     miss:'よくある誤り → 「Me took the science homework 3hours」。人を主語にしない。'},
    {type:"order", jp:"私たちは彼をジミーと呼ぶ。", tokens:["we","call","him","Jimmy"], answer:"We call him Jimmy",
     explain:'<span class="kw">call O C（OをCと呼ぶ）</span>の第5文型。him = Jimmy。'},
    {type:"order", jp:"みんな彼のことを天才だと思っていた。", tokens:["everyone","him","genius","a","believed"], answer:"Everyone believed him a genius",
     explain:'<span class="kw">SVOC</span>。believe O C（OをCだと思う）。him = a genius の関係。'},
  ]},

  /* ---------- スタディサプリ：時制 ---------- */
  {id:"sup_jisei", group:"スタディサプリ 確認テスト", title:"② 時制", emoji:"⏳", sub:"並べ替え・10問", q:[
    {type:"order", jp:"ホテルに着いたら、私にお電話ください。", prefix:"Please", suffix:"arrive at the hotel.", tokens:["give","you","me","call","when","a"], answer:"give me a call when you",
     explain:'<span class="kw">give me a call</span>（電話をください）＝give+人+物 の形。時を表す when you arrive を後ろに置く。',
     miss:'よくある誤り → 「call me when you give a」。give A B の語順を思い出そう。'},
    {type:"order", jp:"彼女は今週金曜日、飛行機でシンガポールに行く予定です。", tokens:["Singapore","to","she's","flying"], suffix:"this Friday.", answer:"She's flying to Singapore",

/* デッキを id で引けるように */
const DECK_MAP = {};
DECKS.forEach(d=>{DECK_MAP[d.id]=d;});
let TOTAL_Q = 0; DECKS.forEach(d=>TOTAL_Q+=d.q.length);

/* =====================================================================
   LocalStorage：問題ごとの結果を保存
   RESULTS = { deckId: { idx: "correct" | "wrong" } }
   → 進捗ゲージ・○×一覧・苦手ストック・途中再開 すべてここから導出
   ===================================================================== */
const LS_RESULTS = "eigoDrill2.results.v1";
function loadResults(){try{return JSON.parse(localStorage.getItem(LS_RESULTS))||{};}catch(e){return {};}}
function saveResults(){try{localStorage.setItem(LS_RESULTS,JSON.stringify(RESULTS));}catch(e){}}
let RESULTS = loadResults();
function setResult(deckId,idx,status){if(!RESULTS[deckId])RESULTS[deckId]={};RESULTS[deckId][idx]=status;saveResults();}
function getResult(deckId,idx){return RESULTS[deckId]&&RESULTS[deckId][idx];}
function deckStats(id){
  const d=DECK_MAP[id];const r=RESULTS[id]||{};let answered=0,correct=0;
  for(let i=0;i<d.q.length;i++){const s=r[i];if(s){answered++;if(s==="correct")correct++;}}
  return {answered,correct,total:d.q.length};
}
function firstUnanswered(id){const d=DECK_MAP[id];const r=RESULTS[id]||{};for(let i=0;i<d.q.length;i++)if(!r[i])return i;return 0;}
function wrongList(){
  const out=[];
  for(const id in RESULTS){if(!DECK_MAP[id])continue;
    for(const idx in RESULTS[id]){if(RESULTS[id][idx]==="wrong"&&DECK_MAP[id].q[+idx])out.push(id+"#"+idx);}}
  return out;
}

/* =====================================================================
   画面
   ===================================================================== */
const screens={start:document.getElementById("screen-start"),quiz:document.getElementById("screen-quiz"),result:document.getElementById("screen-result")};
function show(name){for(const k in screens)screens[k].classList.add("hidden");screens[name].classList.remove("hidden");window.scrollTo(0,0);}

/* セッション状態 */
let S = null;

/* =====================================================================
   スタート画面
   ===================================================================== */
function renderStart(){
  document.getElementById("total-badge").textContent="全 "+TOTAL_Q+" 問";
  // 苦手ストック
  const slot=document.getElementById("resume-slot");slot.innerHTML="";
  const wl=wrongList();
  if(wl.length>0){
    const box=document.createElement("div");box.className="resume-box";
    box.innerHTML='<div class="rt">苦手ストックに <b>'+wl.length+'問</b> たまっています。<br>くり返して弱点をつぶそう！</div>';
    const b=document.createElement("button");b.className="btn-small";b.textContent="やり直す";
    b.onclick=startWrongReview;box.appendChild(b);slot.appendChild(box);
  }
  // デッキ一覧（グループごと）
  const list=document.getElementById("deck-list");list.innerHTML="";
  let curGroup=null;
  DECKS.forEach(d=>{
    if(d.group!==curGroup){curGroup=d.group;const g=document.createElement("div");g.className="group-label";g.textContent="📂 "+curGroup;list.appendChild(g);}
    const st=deckStats(d.id);
    const pctA=Math.round(st.answered/st.total*100);
    const full=st.answered===st.total;
    const partial=st.answered>0&&!full;
    let mark;
    if(st.answered===0)mark="未挑戦";
    else if(partial)mark="途中 "+st.answered+"/"+st.total;
    else if(st.correct===st.total)mark="🎉 全問正解";
    else mark="✓ 完了";
    const btn=document.createElement("button");
    btn.className="deck"+(full?" done":"")+(partial?" partial":"");
    btn.innerHTML=
      '<span class="d-emoji">'+d.emoji+'</span>'+
      '<span class="d-main">'+
        '<span class="d-title">'+d.title+'</span>'+
        '<span class="d-sub">'+d.sub+'</span>'+
        '<span class="d-bar"><span class="d-bar-fill" style="width:'+pctA+'%"></span></span>'+
      '</span>'+
      '<span class="d-right"><span class="d-count">正解 '+st.correct+'/'+st.total+'</span><span class="d-mark">'+mark+'</span></span>';
    btn.onclick=()=>startDeck(d.id);
    list.appendChild(btn);
  });
}

/* =====================================================================
   出題開始
   ===================================================================== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startDeck(id,forceRestart){
  const d=DECK_MAP[id];
  S={mode:"deck",deckId:id,label:d.title,
     items:d.q.map((q,i)=>({deckId:id,idx:i})), // 順番通り（並べ替えは順序が意味を持つ）
     itemStatus:d.q.map((q,i)=>getResult(id,i)||null), // 保存済みの○×を引き継ぐ
     pos:forceRestart?0:firstUnanswered(id),         // 途中なら続きから再開
     wrongThisRun:[]};
  show("quiz");renderQuestion();
}
function startWrongReview(){
  const wl=shuffle(wrongList());if(!wl.length)return;
  S={mode:"review",deckId:null,label:"苦手やり直し",
     items:wl.map(k=>{const[id,i]=k.split("#");return {deckId:id,idx:+i};}),
     itemStatus:wl.map(()=>null),
     pos:0,wrongThisRun:[]};
  show("quiz");renderQuestion();
}
function startRetryThisRun(){
  const w=S.wrongThisRun.slice();if(!w.length)return;
  S={mode:"review",deckId:null,label:"まちがい直し",items:shuffle(w),
     itemStatus:w.map(()=>null),pos:0,wrongThisRun:[]};
  show("quiz");renderQuestion();
}
function sessionCorrect(){return S.itemStatus.filter(s=>s==="correct").length;}
function sessionAnswered(){return S.itemStatus.filter(s=>s).length;}
function jumpTo(i){S.pos=i;renderQuestion();}

/* =====================================================================
   問題描画（type で分岐）
   ===================================================================== */
let CUR={}; // 現在の問題の作業状態

function getCurQ(){const it=S.items[S.pos];return {q:DECK_MAP[it.deckId].q[it.idx],key:it.deckId+"#"+it.idx,it};}

function renderDots(){
  const el=document.getElementById("dots");el.innerHTML="";
  S.items.forEach((it,i)=>{
    const b=document.createElement("button");
    const st=S.itemStatus[i];
    b.className="dot"+(st?" "+st:"")+(i===S.pos?" current":"");
    b.textContent=st==="correct"?"○":(st==="wrong"?"×":(i+1));
    b.title="問題 "+(i+1);
    b.onclick=()=>jumpTo(i);
    el.appendChild(b);
  });
}

function renderQuestion(){
  const total=S.items.length;const {q,it}=getCurQ();
  const deck=DECK_MAP[it.deckId];
  document.getElementById("quiz-deck").textContent=S.label;
  document.getElementById("quiz-score").textContent="⭐ "+sessionCorrect()+" 正解";
  document.getElementById("pbar").style.width=Math.round(sessionAnswered()/total*100)+"%";
  document.getElementById("ptext").textContent="問題 "+(S.pos+1)+" / "+total+"　（回答済 "+sessionAnswered()+"／"+total+"）";
  renderDots();

  const modeEl=document.getElementById("q-mode");
  const modeLabel=document.getElementById("q-mode-label");
  if(S.mode==="review"){modeEl.className="q-mode retry";modeLabel.textContent="🔁 "+S.label+"（"+deck.title+"）";}
  else{modeEl.className="q-mode";modeLabel.textContent=deck.emoji+" "+deck.title;}
  const typeNames={order:"並べ替え",mc:"4択",fill:"穴埋め",cloze:"要約穴埋め",verb:"スペル",conj:"入力"};
  document.getElementById("q-type-tag").textContent=typeNames[q.type]||"";

  const body=document.getElementById("q-body");body.innerHTML="";
  document.getElementById("explain-slot").innerHTML="";
  CUR={answered:false};

  if(q.type==="order")   renderOrder(q,body);
  else if(q.type==="mc") renderMC(q,body);
  else if(q.type==="cloze") renderCloze(q,body);
  else if(q.type==="verb")  renderVerb(q,body);
  else                   renderConj(q,body); // fill / conj

  // メインボタン
  const btn=document.getElementById("main-btn");
  if(q.type==="mc"){btn.classList.add("hidden");} // MCはタップで即判定
  else{btn.classList.remove("hidden");btn.className="action-btn btn-check";btn.textContent="答え合わせ";btn.onclick=checkAnswer;}
}

/* --- 並べ替え --- */
function renderOrder(q,body){
  CUR.placed=[]; // {token,id}
  CUR.source=shuffle(q.tokens.map((t,i)=>({token:t,id:i})));
  const jp=document.createElement("div");jp.className="q-jp";jp.textContent="🗣 "+q.jp;body.appendChild(jp);
  const hint=document.createElement("div");hint.className="order-hint";hint.innerHTML="👉 <span style='color:#fcd34d'>〔　〕</span>の中に単語を並べて、文を完成させよう";body.appendChild(hint);
  if(q.jpNote){const n=document.createElement("div");n.className="q-en";n.style.cssText="font-size:12.5px;color:var(--sub)";n.textContent=q.jpNote;body.appendChild(n);}
  const line=document.createElement("div");line.className="sentence-line";line.id="sentence-line";body.appendChild(line);
  const sz=document.createElement("div");sz.className="source-zone";sz.id="source-zone";body.appendChild(sz);
  const clr=document.createElement("button");clr.className="clear-link";clr.textContent="↺ 並べ直す";clr.onclick=()=>{if(CUR.answered)return;CUR.source=CUR.source.concat(CUR.placed);CUR.placed=[];drawOrder(q);};body.appendChild(clr);
  drawOrder(q);
}
function drawOrder(q){
  const line=document.getElementById("sentence-line");const sz=document.getElementById("source-zone");
  line.innerHTML="";sz.innerHTML="";
  // 前置きの固定語
  if(q.prefix){const p=document.createElement("span");p.className="fixed-txt";p.textContent=q.prefix;line.appendChild(p);}
  // 〔 開き括弧
  const ob=document.createElement("span");ob.className="slot-brk";ob.textContent="〔";line.appendChild(ob);
  // 挿入エリア
  const az=document.createElement("span");az.className="answer-zone"+(CUR.placed.length===0?" empty":"");az.id="answer-zone";line.appendChild(az);
  CUR.placed.forEach((c,i)=>{
    const el=document.createElement("span");el.className="chip in-answer";el.textContent=c.token;
    if(!CUR.answered)el.onclick=()=>{CUR.source.push(c);CUR.placed.splice(i,1);drawOrder(q);};
    az.appendChild(el);
  });
  // 〕 閉じ括弧
  const cb=document.createElement("span");cb.className="slot-brk";cb.textContent="〕";line.appendChild(cb);
  // 記号（? など）と後ろの固定語
  if(q.suffixMark){const sm=document.createElement("span");sm.className="fixed-txt";sm.textContent=q.suffixMark;line.appendChild(sm);}
  if(q.suffix){const s=document.createElement("span");s.className="fixed-txt";s.textContent=q.suffix;line.appendChild(s);}
  // 選択肢（元の単語プール）
  CUR.source.forEach((c,i)=>{
    const el=document.createElement("span");el.className="chip";el.textContent=c.token;
    if(!CUR.answered)el.onclick=()=>{CUR.placed.push(c);CUR.source.splice(i,1);drawOrder(q);};
    sz.appendChild(el);
  });
}

/* --- 4択 --- */
function renderMC(q,body){
  if(q.jp){const jp=document.createElement("div");jp.className="q-jp";jp.textContent=q.jp;body.appendChild(jp);}
  if(q.en){const en=document.createElement("div");en.className="q-en";en.innerHTML=q.en.replace(/___/g,'<span class="blank">___</span>');body.appendChild(en);}
  const box=document.createElement("div");box.className="choices";body.appendChild(box);
  const marks=["A","B","C","D"];
  q.choices.forEach((c,idx)=>{
    const b=document.createElement("button");b.className="choice";
    b.innerHTML='<span class="mk">'+marks[idx]+'</span><span>'+escapeHtml(c)+'</span>';
    b.onclick=()=>{if(CUR.answered)return;judgeMC(q,idx);};
    box.appendChild(b);
  });
}
function judgeMC(q,selected){
  CUR.answered=true;
  const correct=q.answer;const ok=selected===correct;
  document.querySelectorAll("#q-body .choice").forEach((b,i)=>{
    b.classList.add("disabled");
    if(i===correct)b.classList.add("correct");
    else if(i===selected)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  finishQuestion(ok,q,escapeHtml(q.choices[correct]));
}

/* --- Cloze（要約穴埋め） --- */
function renderCloze(q,body){
  if(q.jp){const jp=document.createElement("div");jp.className="q-jp";jp.textContent=q.jp;body.appendChild(jp);}
  const wrap=document.createElement("div");wrap.className="cloze-text";
  const parts=q.text.split("{}");let html="";
  parts.forEach((p,i)=>{html+=escapeHtml(p);if(i<parts.length-1)html+='<input class="cloze-in" data-i="'+i+'" autocapitalize="off" autocomplete="off" spellcheck="false">';});
  wrap.innerHTML=html;body.appendChild(wrap);
}

/* --- 動詞3変化 --- */
function renderVerb(q,body){
  const vb=document.createElement("div");vb.className="verb-base";
  vb.innerHTML='<div class="vb-word">'+q.base+'</div><div class="vb-mean">'+q.mean+'</div><span class="vb-pat">'+q.pat+'</span>';
  body.appendChild(vb);
  const labels=[["past","過去形"],["pp","過去分詞形"],["ing","-ing形"]];
  labels.forEach(([key,lab])=>{
    const row=document.createElement("div");row.className="vrow";
    row.innerHTML='<span class="vlab">'+lab+'</span><input class="fill-in" data-key="'+key+'" autocapitalize="off" autocomplete="off" spellcheck="false"><span class="vans" data-ans="'+key+'"></span>';
    body.appendChild(row);
  });
  setTimeout(()=>{const f=body.querySelector('input');if(f)f.focus();},50);
}

/* --- fill / conj（単一空所タイピング） --- */
function renderConj(q,body){
  if(q.jp){const jp=document.createElement("div");jp.className="q-jp";jp.textContent="🗣 "+q.jp;body.appendChild(jp);}
  const en=document.createElement("div");en.className="q-en";en.innerHTML=(q.en||"").replace(/___/g,'<span class="blank">____</span>');body.appendChild(en);
  if(q.hint){const h=document.createElement("div");h.style.cssText="font-size:12px;color:var(--sub);margin-bottom:10px;";h.textContent="ヒント（原形など）："+q.hint;body.appendChild(h);}
  const inp=document.createElement("input");inp.className="fill-in";inp.id="conj-input";inp.setAttribute("autocapitalize","off");inp.setAttribute("autocomplete","off");inp.setAttribute("spellcheck","false");inp.placeholder="ここに入力";
  body.appendChild(inp);
  setTimeout(()=>inp.focus(),50);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!CUR.answered)checkAnswer();});
}

/* =====================================================================
   答え合わせ（order / cloze / verb / conj）
   ===================================================================== */
function norm(s){return String(s).toLowerCase().replace(/[“”"?!.,]/g,"").replace(/\s+/g," ").trim();}

function checkAnswer(){
  if(CUR.answered)return;
  const {q}=getCurQ();
  if(q.type==="order")      checkOrder(q);
  else if(q.type==="cloze") checkCloze(q);
  else if(q.type==="verb")  checkVerb(q);
  else                      checkConj(q);
}

function checkOrder(q){
  CUR.answered=true;
  const user=CUR.placed.map(c=>c.token).join(" ");
  const ok=norm(user)===norm(q.answer);
  // チップの色付け
  document.querySelectorAll("#answer-zone .chip").forEach(el=>el.classList.add("disabled"));
  const az=document.getElementById("answer-zone");
  az.querySelectorAll(".chip").forEach(el=>{el.style.background=ok?"var(--correct)":"var(--wrong)";el.style.borderColor=ok?"var(--correct)":"var(--wrong)";el.style.color="#fff";});
  const full=(q.prefix?q.prefix+" ":"")+q.answer+(q.suffixMark?q.suffixMark:"")+(q.suffix?" "+q.suffix:"");
  finishQuestion(ok,q,escapeHtml(full),ok?null:escapeHtml((q.prefix?q.prefix+" ":"")+user));
}

function checkCloze(q){
  CUR.answered=true;let allOk=true;
  document.querySelectorAll("#q-body .cloze-in").forEach((inp,i)=>{
    const ok=norm(inp.value)===norm(q.answers[i]);if(!ok)allOk=false;
    inp.classList.add(ok?"ok":"ng");inp.disabled=true;
    if(!ok){inp.value=inp.value?inp.value+" → "+q.answers[i]:q.answers[i];}
  });
  finishQuestion(allOk,q,q.answers.map(escapeHtml).join(" / "));
}

function checkVerb(q){
  CUR.answered=true;let allOk=true;
  const keys={past:q.past,pp:q.pp,ing:q.ing};
  const alts={pp:q.ppAlt||[]};
  document.querySelectorAll("#q-body .fill-in").forEach(inp=>{
    const key=inp.dataset.key;const correct=keys[key];
    const accept=[correct].concat(alts[key]||[]).map(norm);
    const ok=accept.includes(norm(inp.value));if(!ok)allOk=false;
    inp.classList.add(ok?"ok":"ng");inp.disabled=true;
    const ans=inp.parentElement.querySelector('[data-ans="'+key+'"]');
    ans.textContent=(ok?"◯ ":"→ ")+correct+((alts[key]&&alts[key].length)?" ("+alts[key].join("/")+")":"");
    ans.className="vans "+(ok?"ok":"ng");
  });
  const full=q.base+" - "+q.past+" - "+q.pp+" - "+q.ing;
  finishQuestion(allOk,{explain:'<span class="kw">'+q.pat+'</span>：'+q.base+'（'+q.mean+'）→ 過去 '+q.past+' / 過去分詞 '+q.pp+' / -ing '+q.ing+'。声に出してリズムで覚えよう！'},full);
}

function checkConj(q){
  CUR.answered=true;
  const inp=document.getElementById("conj-input");
  const accept=[q.answer].concat(q.accept||[]).map(norm);
  const ok=accept.includes(norm(inp.value));
  inp.classList.add(ok?"ok":"ng");inp.disabled=true;
  finishQuestion(ok,q,escapeHtml(q.answer),ok?null:escapeHtml(inp.value||"（無回答）"));
}

/* =====================================================================
   共通：判定後処理（解説表示・スコア・ストック・次へ）
   ===================================================================== */
function finishQuestion(ok,q,answerText,userWrong){
  const it=S.items[S.pos];
  S.itemStatus[S.pos]=ok?"correct":"wrong";
  setResult(it.deckId,it.idx,ok?"correct":"wrong"); // ブラウザに保存（正解なら苦手から自動で外れる）
  if(!ok&&!S.wrongThisRun.some(w=>w.deckId===it.deckId&&w.idx===it.idx))S.wrongThisRun.push({...it});
  renderDots();
  const total=S.items.length;
  document.getElementById("quiz-score").textContent="⭐ "+sessionCorrect()+" 正解";
  document.getElementById("pbar").style.width=Math.round(sessionAnswered()/total*100)+"%";
  document.getElementById("ptext").textContent="問題 "+(S.pos+1)+" / "+total+"　（回答済 "+sessionAnswered()+"／"+total+"）";

  const slot=document.getElementById("explain-slot");
  let html='<div class="explain '+(ok?"ok":"ng")+'">';
  html+='<div class="head">'+(ok?"⭕ 正解！":"❌ おしい！")+'</div>';
  if(answerText)html+='<div class="ans">正解：<b>'+answerText+'</b></div>';
  if(userWrong)html+='<div class="ans" style="color:#fca5a5">あなたの解答：'+userWrong+'</div>';
  if(q.explain)html+='<div class="body">'+q.explain+'</div>';
  if(q.miss&&!ok)html+='<div class="miss">💡 '+q.miss+'</div>';
  html+='</div>';
  slot.innerHTML=html;

  const btn=document.getElementById("main-btn");btn.classList.remove("hidden");
  btn.className="action-btn btn-next";
  btn.textContent=(S.pos+1>=S.items.length)?"結果を見る →":"次の問題へ →";
  btn.onclick=nextQuestion;
  btn.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQuestion(){
  S.pos++;
  if(S.pos>=S.items.length)renderResult();
  else renderQuestion();
}

/* =====================================================================
   結果
   ===================================================================== */
function renderResult(){
  show("result");
  const total=S.items.length,correct=sessionCorrect(),wrong=S.itemStatus.filter(s=>s==="wrong").length;
  const pct=total?Math.round(correct/total*100):0;
  document.getElementById("result-deck").textContent=S.label;
  document.getElementById("result-pct").textContent=pct+"%";
  document.getElementById("stat-correct").textContent=correct;
  document.getElementById("stat-wrong").textContent=wrong;
  document.getElementById("stat-total").textContent=total;
  document.getElementById("ring").style.setProperty("--deg",(pct*3.6)+"deg");
  let msg;if(pct===100)msg="🎉 全問正解！完璧です！";else if(pct>=80)msg="👍 よくできました！あと少し！";else if(pct>=50)msg="💪 いい調子。まちがい直しで固めよう！";else msg="📖 くり返せば必ず伸びる！もう一度！";
  document.getElementById("result-msg").textContent=msg;

  const rb=document.getElementById("retry-wrong-btn");
  if(S.wrongThisRun.length>0){rb.classList.remove("disabled");rb.textContent="まちがえた "+S.wrongThisRun.length+" 問だけやり直す";rb.onclick=startRetryThisRun;}
  else{rb.classList.add("disabled");rb.textContent="まちがいなし！やり直し不要 🙆";rb.onclick=null;}

  const stock=wrongList().length;
  document.getElementById("stock-note").textContent=stock>0?"📌 苦手ストックが "+stock+"問（トップからいつでも反復できます）":"苦手ストックは空っぽ！おみごと ✨";
}

/* =====================================================================
   ナビ・ユーティリティ
   ===================================================================== */
document.getElementById("again-btn").onclick=()=>{if(S.mode==="deck")startDeck(S.deckId,true);else startWrongReview();};
document.getElementById("home-btn").onclick=()=>{renderStart();show("start");};
document.getElementById("quit-btn").onclick=()=>{renderStart();show("start");};
document.getElementById("clear-btn").onclick=()=>{if(confirm("すべての学習記録（○×・進捗・苦手ストック）を消します。よろしいですか？")){RESULTS={};saveResults();renderStart();}};

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

renderStart();show("start");
</script>
