<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春の漢字ドリル</title>
<style>
  :root {
    --ink: #1a2b35;
    --ink-soft: #52626b;
    --paper: #eef1ec;
    --card: #fbfcfa;
    --line: #d3dace;
    --seal: #b7492f;
    --accent: #2f6b57;
    --accent-soft: #e4efe8;
    --gold: #b98a2e;
    --shadow: rgba(26,43,53,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(47,107,87,0.05), transparent 42%),
      radial-gradient(circle at 85% 80%, rgba(185,138,46,0.05), transparent 45%);
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 16px 16px;
  }

  /* ── ヘッダー ── */
  header {
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .seal {
    flex-shrink: 0;
    width: 54px; height: 54px;
    background: var(--seal);
    color: #fff;
    border-radius: 10px;
    display: grid;
    place-content: center;
    text-align: center;
    font-weight: 700;
    line-height: 1.05;
    font-size: 20px;
    letter-spacing: 2px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15) inset, 0 4px 10px var(--shadow);
    transform: rotate(-3deg);
  }
  .seal span { display: block; font-size: 20px; }

  .title-block h1 {
    font-size: 21px;
    letter-spacing: 3px;
    font-weight: 700;
  }
  .title-block p {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-top: 3px;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  }

  /* ── 範囲えらび ── */
  .ranges {
    width: 100%;
    max-width: 560px;
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .range-btn {
    flex: 1;
    padding: 10px 4px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 12px;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s ease;
    line-height: 1.3;
  }
  .range-btn small {
    display: block;
    font-size: 10px;
    font-weight: 400;
    opacity: .7;
    margin-top: 2px;
  }
  .range-btn.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ── カード ── */
  .stage {
    width: 100%;
    max-width: 560px;
    perspective: 1400px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .stage > .card { flex: 1; }

  .card {
    position: relative;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 24px 22px;
    box-shadow: 0 10px 30px var(--shadow), 0 2px 0 rgba(255,255,255,0.7) inset;
    display: flex;
    flex-direction: column;
    transition: transform .32s cubic-bezier(.34,1.2,.5,1), opacity .32s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 22px; top: 22px; bottom: 22px;
    width: 3px;
    background: linear-gradient(var(--accent), transparent);
    border-radius: 3px;
    opacity: .5;
  }
  .card.turning { transform: rotateY(7deg) translateY(6px); opacity: 0; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    margin-bottom: 14px;
    padding-left: 14px;
  }
  .q-count {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .q-count b { color: var(--accent); font-size: 15px; }
  .tag {
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 3px 10px;
    letter-spacing: 1px;
  }

  /* 問題文 */
  .sentence {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-left: 14px;
  }
  .sentence .lead {
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 31px;
    line-height: 1.6;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .blank {
    display: inline-block;
    min-width: 1.5em;
    border-bottom: 3px solid var(--seal);
    text-align: center;
    color: transparent;
    position: relative;
    margin: 0 2px;
  }
  .hint {
    display: inline-block;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 13px;
    color: var(--seal);
    vertical-align: super;
    letter-spacing: 1px;
  }

  /* 答え */
  .answer {
    margin-top: 14px;
    padding: 14px 14px 0;
    border-top: 1.5px dashed var(--line);
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
    min-height: 40px;
  }
  .answer.show { opacity: 1; transform: translateY(0); }
  .answer .label {
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .answer .kanji {
    font-size: 46px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 4px;
  }
  .answer .reading {
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
    letter-spacing: 2px;
  }

  /* ── 操作ボタン ── */
  .controls {
    width: 100%;
    max-width: 560px;
    display: flex;
    gap: 12px;
    margin-top: 14px;
  }
  button.action {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
  }
  button.action:active { transform: translateY(2px); }
  .reveal-btn {
    background: var(--seal);
    color: #fff;
    box-shadow: 0 4px 0 #93381f;
  }
  .reveal-btn:active { box-shadow: 0 1px 0 #93381f; }
  .next-btn {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 0 #1f4a3c;
  }
  .next-btn:active { box-shadow: 0 1px 0 #1f4a3c; }
  .reveal-btn:disabled {
    background: #cfd6cd;
    color: #fff;
    box-shadow: 0 4px 0 #b3bbb0;
    cursor: default;
  }

  #cheer {
    padding: 16px 10px 0;
    border-top: 1px solid var(--line);
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.5;
    flex-shrink: 0;
    transition: transform .2s ease, color .2s ease;
  }
  #cheer.pop { transform: scale(1.06); }
  #cheer.gold { color: var(--gold); }
  #cheer.quote {
    color: var(--ink);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.5;
  }
  #cheer.quote .q-word {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 600;
    color: var(--accent);
    font-size: 19px;
  }
  #cheer.quote .q-by {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 5px;
    letter-spacing: 0.5px;
  }

  /* 小さい画面では余白と文字を少し圧縮して一画面を守る */
  @media (max-height: 700px) {
    .q-text { font-size: 27px; line-height: 1.5; }
    .answer .kanji { font-size: 40px; }
    .card { padding: 18px 20px 16px; }
    .card-top { margin-bottom: 10px; }
    #cheer { font-size: 15px; padding-top: 12px; }
    #cheer.quote { font-size: 15px; }
    #cheer.quote .q-word { font-size: 16px; }
    .sentence .lead { margin-bottom: 8px; }
    .answer { margin-top: 10px; padding-top: 10px; min-height: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .answer, button.action { transition: none; }
  }
</style>
</head>

  let pool = [];        // 出題対象のインデックス配列
  let order = [];       // シャッフル済みの出題順
  let cursor = 0;       // 今何問目か
  let done = 0;         // 見た問題数
  let revealed = false;

  const el = {
    qtext: document.getElementById("qtext"),
    answer: document.getElementById("answer"),
    ansKanji: document.getElementById("ans-kanji"),
    ansReading: document.getElementById("ans-reading"),
    revealBtn: document.getElementById("revealBtn"),
    nextBtn: document.getElementById("nextBtn"),
    card: document.getElementById("card"),
    done: document.getElementById("done"),
    total: document.getElementById("total"),
    tag: document.getElementById("tag"),
    cheer: document.getElementById("cheer"),
  };

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildPool(range) {
    const groups = { haru: [1, 2], natsu: [3], brest: [4] };
    const sets = groups[range] || [1, 2];
    pool = DATA.map((_, i) => i).filter(i => sets.includes(DATA[i].set));
    order = shuffle(pool);
    cursor = 0;
    done = 0;
    el.total.textContent = pool.length;
    el.done.textContent = 0;
  }

  function renderSentence(text, hint) {
    // ＿ を空欄に置き換え、ふりがなヒントを添える
    const parts = text.split("＿");
    let html = "";
    parts.forEach((p, i) => {
      html += escapeHtml(p);
      if (i < parts.length - 1) {
        html += `<span class="blank">　<span class="hint">${escapeHtml(hint)}</span></span>`;
      }
    });
    return html;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  }

  function showQuestion() {
    if (pool.length === 0) {
      el.qtext.innerHTML = '<span style="font-size:20px;color:var(--ink-soft);font-family:sans-serif;">この範囲はまだ準備中だよ。<br>もう少し待っててね。</span>';
      el.answer.classList.remove("show");
      el.revealBtn.disabled = true;
      el.tag.textContent = "";
      return;
    }
    if (cursor >= order.length) {
      order = shuffle(pool);  // ひと回りしたら混ぜ直してエンドレス
      cursor = 0;
    }
    const q = DATA[order[cursor]];
    // まず答えを即座に隠す（アニメ前に消すことで一瞬見えるのを防ぐ）
    el.answer.style.transition = "none";
    el.answer.classList.remove("show");
    revealed = false;
    el.card.classList.add("turning");
    setTimeout(() => {
      el.qtext.innerHTML = renderSentence(q.text, q.hint);
      el.ansKanji.textContent = q.kanji;
      el.ansReading.textContent = q.reading;
      el.tag.textContent = TAGS[q.set];
      el.answer.style.transition = "";  // トランジションを戻す
      el.revealBtn.disabled = false;
      el.revealBtn.textContent = "答えを見る";
      el.card.classList.remove("turning");
      el.cheer.classList.remove("gold", "quote");
      el.cheer.innerHTML = WAITING[Math.floor(Math.random() * WAITING.length)];
    }, 200);
  }

  function reveal() {
    if (revealed) return;
    el.answer.classList.add("show");
    revealed = true;
    el.revealBtn.disabled = true;
    done++;
    el.done.textContent = done;
    showCheer();
  }

  function showCheer() {
    const remain = pool.length - done;
    let msg, gold = false, quote = false;
    if (remain === 0) {
      msg = "全部クリア！！ きみは漢字マスターだ🏆";
      gold = true;
    } else if (done % 10 === 0) {
      msg = `${done}問クリア！すごい🎉 のこり${remain}問、いける？`;
      gold = true;
    } else if (remain <= 3) {
      msg = `ラスト${remain}問！ ゴールはすぐそこだ🏃💨`;
      gold = true;
    } else {
      // ふだんは名言を1つ出す
      const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      const by = q.by ? `<span class="q-by">— ${q.by}</span>` : "";
      msg = `<span class="q-word">${q.w}</span>${by}`;
      quote = true;
    }
    el.cheer.innerHTML = msg;
    el.cheer.classList.toggle("gold", gold);
    el.cheer.classList.toggle("quote", quote);
    el.cheer.classList.remove("pop");
    void el.cheer.offsetWidth; // リフローでアニメ再生
    el.cheer.classList.add("pop");
    setTimeout(() => el.cheer.classList.remove("pop"), 220);
  }

  function next() {
    cursor++;
    showQuestion();
  }

  // ── イベント ──
  el.revealBtn.addEventListener("click", reveal);
  el.nextBtn.addEventListener("click", next);

  document.getElementById("ranges").addEventListener("click", (e) => {
    const btn = e.target.closest(".range-btn");
    if (!btn) return;
    document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    buildPool(btn.dataset.range);
    showQuestion();
  });

  // キーボードショートカット（PC用）: スペース=答え, →=次
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); reveal(); }
    if (e.code === "ArrowRight" || e.code === "Enter") { e.preventDefault(); next(); }
  });

  // 起動
  buildPool("all");
  showQuestion();
</script>
